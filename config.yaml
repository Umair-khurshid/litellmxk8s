model_list:
  - model_name: main-fast
    litellm_params:
      model: openai/main-fast
      api_base: https://llm.example.com/v1
      api_key: os.environ/FAST_API_KEY

  - model_name: main-pro
    litellm_params:
      model: openai/main-pro
      api_base: https://llm.example.com/v1
      api_key: os.environ/PRO_API_KEY

  - model_name: main-vision
    litellm_params:
      model: openai/main-vision
      api_base: https://llm.example.com/v1
      api_key: os.environ/VISION_API_KEY

litellm_settings:
  drop_params: true
  cache: true
  json_logs: true
  default_fallbacks:
    - main-fast
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
    ttl: 3600

router_settings:
  redis_host: redis
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  background_health_checks: true
  health_check_interval: 3600
